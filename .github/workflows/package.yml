name: Package Scripts

on:
    workflow_call:
        inputs:
            package_suffix:
                description: Suffix used for the ZIP and artifact names
                required: false
                type: string
        outputs:
            artifact_name:
                description: GitHub Actions artifact name
                value: ${{ jobs.package.outputs.artifact_name }}
            asset_name:
                description: Release ZIP file name
                value: ${{ jobs.package.outputs.asset_name }}
    workflow_dispatch:
        inputs:
            package_suffix:
                description: Optional suffix used for the ZIP and artifact names
                required: false
                type: string
    push:
        branches:
            - '**'
        paths:
            - '**'
            - '!.github/**'
            - '!.vscode/**'
            - '!.AI_work/**'
            - '!.gitignore'
            - '!.gitattributes'
            - '!.prettierrc.json'
            - '!.prettierignore'
            - '!jsconfig.json'
            - '!typings.d.ts'
            - '!AGENTS.md'
            - '.github/workflows/package.yml'
            - '.github/scripts/build-package.py'
    pull_request:
        paths:
            - '**'
            - '!.github/**'
            - '!.vscode/**'
            - '!.AI_work/**'
            - '!.gitignore'
            - '!.gitattributes'
            - '!.prettierrc.json'
            - '!.prettierignore'
            - '!jsconfig.json'
            - '!typings.d.ts'
            - '!AGENTS.md'
            - '.github/workflows/package.yml'
            - '.github/scripts/build-package.py'

permissions:
    contents: read

concurrency:
    group: package-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    package:
        runs-on: ubuntu-24.04
        outputs:
            artifact_name: ${{ steps.names.outputs.artifact_name }}
            asset_name: ${{ steps.names.outputs.asset_name }}

        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Resolve package names
              id: names
              env:
                  PACKAGE_SUFFIX: ${{ inputs.package_suffix }}
                  REF_NAME: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -euo pipefail

                  SUFFIX="${PACKAGE_SUFFIX:-${REF_NAME:-${SHA:0:12}}}"
                  SAFE_SUFFIX="${SUFFIX//\//-}"
                  ASSET_NAME="V5-Offline-Scripts-${SAFE_SUFFIX}.zip"
                  ARTIFACT_NAME="${ASSET_NAME%.zip}"

                  echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
                  echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

            - name: Build cleaned script ZIP
              env:
                  ASSET_NAME: ${{ steps.names.outputs.asset_name }}
              shell: bash
              run: python3 .github/scripts/build-package.py "$ASSET_NAME"

            - name: Prepare artifact contents
              env:
                  ASSET_NAME: ${{ steps.names.outputs.asset_name }}
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf package-artifact
                  mkdir -p package-artifact
                  unzip -q "$ASSET_NAME" -d package-artifact

            - name: Upload package artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ${{ steps.names.outputs.artifact_name }}
                  path: package-artifact/
                  if-no-files-found: error
                  include-hidden-files: true
